services:
  # Servidor de BD
  postgres:
    image: postgres:16-alpine
    container_name: chefcito-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chefcito
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chefcito"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  # Aplicación Next.js
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: chefcito-app
    restart: always
    ports:
      - "3008:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/chefcito?schema=public"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
        
volumes:
  postgres_data: